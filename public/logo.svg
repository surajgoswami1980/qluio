<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded square background with gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bg-grad)"/>
  
  <!-- Stylized "E" letter made of 3 horizontal bars with rounded ends -->
  <rect x="12" y="12" width="18" height="3.5" rx="1.75" fill="white"/>
  <rect x="12" y="22.25" width="14" height="3.5" rx="1.75" fill="white" opacity="0.9"/>
  <rect x="12" y="32.5" width="18" height="3.5" rx="1.75" fill="white"/>
  
  <!-- Vertical bar of E -->
  <rect x="12" y="12" width="3.5" height="24" rx="1.75" fill="white"/>
  
  <!-- Nova/star burst (top right) representing innovation -->
  <path d="M36 8 L37.5 13 L42 12 L38.5 15.5 L42 19 L37.5 17.5 L36 22 L34.5 17.5 L30 19 L33.5 15.5 L30 12 L34.5 13 Z" fill="url(#star-grad)"/>
  
  <!-- Small accent dot -->
  <circle cx="36" cy="34" r="3" fill="#fbbf24" opacity="0.8"/>
</svg>

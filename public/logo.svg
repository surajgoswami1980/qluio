<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="syn-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="syn-mark" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#syn-bg)"/>

  <!-- Interlocking "S" node mark: two arcs forming a connected system -->
  <path d="M31 16.5c-1.8-1.9-4.4-3-7.3-3-5.2 0-9.2 3.6-9.2 8 0 3.6 2.6 5.7 6.9 6.8"
        stroke="url(#syn-mark)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M17 31.5c1.8 1.9 4.4 3 7.3 3 5.2 0 9.2-3.6 9.2-8 0-3.6-2.6-5.7-6.9-6.8"
        stroke="url(#syn-mark)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Connection nodes -->
  <circle cx="31" cy="16.5" r="2.6" fill="#06b6d4"/>
  <circle cx="17" cy="31.5" r="2.6" fill="#2563eb"/>
</svg>
